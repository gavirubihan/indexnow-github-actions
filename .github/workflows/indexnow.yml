name: IndexNow Auto Submission

on:
  schedule:
    - cron: "*/30 * * * *"   # Runs every 30 minutes
  workflow_dispatch:      # Allow manual run

jobs:
  run-indexnow:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: List files (Debug)
        run: ls -R .

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install requests

      - name: Run script
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
        run: python indexnow.py

      - name: Commit updated logs and history
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add indexnow_log.txt submitted_urls.txt urls_to_submit.txt || true
          git commit -m "Auto-update logs and history" || true
          git push || true
