name: IndexNow Auto Submission
on:
  schedule:
    - cron: "*/30 * * * *"   # Runs every 30 minutes
  workflow_dispatch:          # Allow manual run

jobs:
  run-indexnow:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      
      - name: Install dependencies
        run: pip install requests
      
      - name: Run IndexNow script
        env:
          INDEXNOW_API_KEY: ${{ secrets.INDEXNOW_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          SITEMAP_URL: ${{ secrets.SITEMAP_URL }}
        run: python indexnow.py
      
      - name: Commit updated history
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          
          # Add the CORRECT history file
          git add submission_history.json indexnow_log.txt urls_to_submit.txt || true
          
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update IndexNow submission history [skip ci]"
            git push
            echo "✅ History updated and pushed"
          else
            echo "ℹ️ No changes to commit"
          fi
      
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-logs-${{ github.run_number }}
          path: |
            indexnow_log.txt
            urls_to_submit.txt
            submission_history.json
          retention-days: 7